
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Follow App</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 20px;
}
.container {
  max-width: 450px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}
.user {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid #ddd;
}
button {
  background: #0095f6;
  color: white;
  border: none;
  padding: 9px 14px;
  border-radius: 6px;
  cursor: pointer;
}
button.following {
  background: #ddd;
  color: black;
}
h3 {
  margin-top: 25px;
}
</style>
</head>
<body>

<div class="container">
  <h2>📸 My Instagram</h2>
  <h3>Suggested People</h3>
  <div id="users"></div>

  <h3>Friends / Following List</h3>
  <div id="friends"></div>
</div>

<script>
const people = [
  { id: 1, name: "Ravi" },
  { id: 2, name: "Kiran" },
  { id: 3, name: "Suresh" },
  { id: 4, name: "Priya" }
];

let following = [];

function toggleFollow(id) {
  if (following.includes(id)) {
    following = following.filter(userId => userId !== id);
  } else {
    following.push(id);
  }
  render();
}

function render() {
  const usersDiv = document.getElementById("users");
  const friendsDiv = document.getElementById("friends");

  usersDiv.innerHTML = "";
  friendsDiv.innerHTML = "";

  people.forEach(person => {
    const isFollowing = following.includes(person.id);

    usersDiv.innerHTML += `
      <div class="user">
        <span>👤 ${person.name}</span>
        <button class="${isFollowing ? 'following' : ''}"
          onclick="toggleFollow(${person.id})">
          ${isFollowing ? 'Following' : 'Follow'}
        </button>
      </div>`;

    if (isFollowing) {
      friendsDiv.innerHTML += `
        <div class="user">
          <span>👤 ${person.name}</span>
          <button onclick="toggleFollow(${person.id})">
            Unfollow
          </button>
        </div>`;
    }
  });

  if (following.length === 0) {
    friendsDiv.innerHTML = "<p>No following users yet.</p>";
  }
}

render();
</script>

</body>
</html>
